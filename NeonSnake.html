<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080b18;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #00ffcc;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #00ffcc;
        }

        .score {
            font-size: 22px;
            margin-bottom: 15px;
        }

        canvas {
            background: #11182b;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 20px #00ffcc55;
        }

        button {
            padding: 12px 25px;
            margin: 12px 5px;
            background: #00ffcc;
            color: #080b18;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: white;
        }

        p {
            margin-top: 10px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="game">
        <h1>Neon Snake</h1>
        <div class="score">Score: <span id="score">0</span></div>
        <div class="score">Best: <span id="bestScore">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div>
            <button id="startBtn" type="button">Start Game</button>
            <button id="resetBtn" type="button">Reset Game</button>
            <button id="pauseBtn" type="button">Pause</button>
        </div>
        <p>Use arrow keys to control the snake.</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('bestScore');

        const size = 20;
        const total = canvas.width / size;
        let snake;
        let food;
        let dx;
        let dy;
        let score;
        let speed;
        let timer;
        let running = false;
        let paused = false;
        let best = Number(localStorage.getItem('bestScore')) || 0;

        function updateScore() {
            scoreEl.textContent = score;
            if (score > best) {
                best = score;
                localStorage.setItem('bestScore', String(best));
            }
            bestScoreEl.textContent = best;
        }

        function createFood() {
            food = {
                x: Math.floor(Math.random() * total),
                y: Math.floor(Math.random() * total)
            };

            if (snake.some(segment => segment.x === food.x && segment.y === food.y)) {
                createFood();
            }
        }

        function draw() {
            ctx.fillStyle = '#11182b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            for (let i = 0; i <= canvas.width; i += size) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            ctx.fillStyle = '#ff3366';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff3366';
            ctx.fillRect(food.x * size + 3, food.y * size + 3, size - 6, size - 6);
            ctx.shadowBlur = 0;

            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#00ffcc' : '#00ffcc55';
                ctx.shadowBlur = index === 0 ? 15 : 5;
                ctx.shadowColor = index === 0 ? '#00ffcc' : '#00ffcc55';
                ctx.fillRect(part.x * size + 2, part.y * size + 2, size - 4, size - 4);
            });
            ctx.shadowBlur = 0;
        }

        function startGame() {
            clearInterval(timer);
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            score = 0;
            speed = 10;
            running = true;
            paused = false;
            document.getElementById('pauseBtn').textContent = 'Pause';
            createFood();
            updateScore();
            draw();
            timer = setInterval(gameLoop, speed);
        }

        function resetGame() {
            clearInterval(timer);
            running = false;
            paused = false;
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            score = 0;
            speed = 10;
            createFood();
            updateScore();
            draw();
            document.getElementById('pauseBtn').textContent = 'Pause';
        }

        function gameOver() {
            running = false;
            clearInterval(timer);
            ctx.fillStyle = 'red';
            ctx.font = '30px Arial';
            ctx.fillText('Game Over', 110, 210);
        }

        function gameLoop() {
            if (!running || paused) return;

            const head = {
                x: snake[0].x + dx,
                y: snake[0].y + dy
            };

            if (head.x < 0 || head.y < 0 || head.x >= total || head.y >= total) {
                gameOver();
                return;
            }

            if (snake.some((segment, index) => index !== 0 && segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 1;
                updateScore();
                createFood();
                speed = Math.max(10, speed - 2);
                clearInterval(timer);
                timer = setInterval(gameLoop, speed);
            } else {
                snake.pop();
            }

            draw();
        }

        function togglePause() {
            if (!running) return;

            paused = !paused;
            const pauseBtn = document.getElementById('pauseBtn');
            pauseBtn.textContent = paused ? 'Resume' : 'Pause';

            if (paused) {
                clearInterval(timer);
            } else {
                timer = setInterval(gameLoop, speed);
            }
        }

        document.addEventListener('keydown', (event) => {
            const keyMap = {
                ArrowUp: { x: 0, y: -1 },
                ArrowDown: { x: 0, y: 1 },
                ArrowLeft: { x: -1, y: 0 },
                ArrowRight: { x: 1, y: 0 }
            };

            if (!keyMap[event.key]) return;

            event.preventDefault();

            const next = keyMap[event.key];
            const isOpposite = (next.x === -dx && next.y === -dy);

            if (isOpposite) return;

            dx = next.x;
            dy = next.y;
        });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);

        startGame();
    </script>
</body>
</html>
